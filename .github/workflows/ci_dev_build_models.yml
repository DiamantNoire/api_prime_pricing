name: CI – dev_build_models

on:
  push:
    branches:
      - dev_charly
      - dev_serge
      - dev_ance
      - main
    paths:
      - 'Repo/dev_build_models/**'
      - 'Repo/environment.yml'
      - 'Repo/requirements.txt'
      - '.github/workflows/ci_dev_build_models.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Repo/dev_build_models/**'
      - 'Repo/environment.yml'

jobs:
  unit-tests:
    name: 🧪 Tests unitaires – Preprocessing & Feature Engineering
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Mise en place de Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          environment-file: Repo/environment.yml
          activate-environment: env_prime_pricing
          python-version: "3.11"

      - name: ✅ Exécuter les tests unitaires
        shell: bash -el {0}
        run: |
          python Repo/dev_build_models/test_unit_data.py -v

      - name: 📊 Résumé des tests
        if: always()
        run: |
          echo "✓ Tests unitaires terminés"
          echo "  - Fixtures: train_unit.csv (5 lignes), test_unit.csv (3 lignes)"
          echo "  - Couverture: Preprocessing + Feature Engineering"

  syntax-check:
    name: 📝 Vérification syntaxe Python
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 🔍 Compiler les fichiers Python
        run: |
          python -m py_compile Repo/dev_build_models/fonctions_utiles.py
          python -m py_compile Repo/dev_build_models/dev_entrainement_modele_frequence.py
          python -m py_compile Repo/dev_build_models/dev_entrainement_modele_severite.py
          python -m py_compile Repo/dev_build_models/fusion_prediction.py
          python -m py_compile Repo/dev_build_models/test_unit_data.py

  summary:
    name: 📋 Résumé CI/CD
    runs-on: ubuntu-latest
    needs: [unit-tests, syntax-check]
    if: always()
    
    steps:
      - name: ✨ Pipeline CI/CD validé
        run: |
          echo "✅ Pipeline CI/CD pour dev_build_models"
          echo ""
          echo "Principes appliqués:"
          echo "  ✓ Dépôt de source unique (Git)"
          echo "  ✓ Fréquentes validations (push → tests automatiques)"
          echo "  ✓ Constructions auto-testantes (unit-tests + syntax-check)"
          echo "  ✓ Environnement stable (conda from environment.yml)"
          echo "  ✓ Visibilité maximale (tous les logs disponibles)"
          echo ""
          echo "État: SUCCÈS" && exit 0
