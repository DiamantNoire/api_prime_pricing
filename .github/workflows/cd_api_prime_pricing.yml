name: CD API Prime Pricing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_run:
    workflows:
      - CI API Prime Pricing
    types:
      - completed

jobs:
  deploy-render:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API (api_prime_pricing)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Deploy App Streamlit (api_prime_pricing_app)
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_APP }}"
