name: CI API Prime Pricing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
      - dev_log_api_process
      - dev_render_published_api
      - dev_test
      - dev_test_validation
      - dev_user_application
  pull_request:
    branches:
      - main
      - dev_log_api_process
      - dev_render_published_api
      - dev_test
      - dev_test_validation
      - dev_user_application

jobs:
  lint-typecheck:
    name: Format/Lint/Typecheck (black, ruff, flake8, pylint, ty)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Installer uv
        run: pip install uv
      - name: Installer les dépendances (prod + dev)
        run: uv pip install -r requirements.txt
      - name: Format, Lint & Typecheck
        run: ./lint_and_typecheck.sh

  tests:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Installer uv
        run: pip install uv
      - name: Installer les dépendances (prod + dev)
        run: uv pip install -r requirements.txt
      - name: Lancer les tests pytest
        run: pytest

  docker:
    name: Build & Test Docker
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.7-dind
        options: >-
          --dns 8.8.8.8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker compose build
      - name: Lancer les services (api, init_db)
        run: docker compose up -d api init_db
      - name: Attendre que l'API soit prête
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8000/docs; then
              echo 'API UP'; exit 0;
            fi
            sleep 2
          done
          echo 'API DOWN'; docker compose logs api; exit 1
      - name: Tester les endpoints FastAPI (curl)
        run: |
          curl -f http://localhost:8000/docs
          curl -f http://localhost:8000/openapi.json
      - name: Lancer les tests unitaires et le lint dans le conteneur test
        run: docker compose run --rm test
      - name: Afficher les logs API
        run: docker compose logs api
      - name: Arrêter les conteneurs
        run: docker compose down
