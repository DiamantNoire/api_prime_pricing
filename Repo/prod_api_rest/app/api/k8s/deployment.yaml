apiVersion: apps/v1
kind: Deployment
metadata:
  name: assurance-pricing-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assurance-pricing-api
  template:
    metadata:
      labels:
        app: assurance-pricing-api
    spec:
      containers:
        - name: api
          image: assurance-pricing-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
