[project]
name = "prime-pricing-api"
version = "1.0.0"
description = "API REST FastAPI pour la prédiction de prime d'assurance automobile"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scikit-learn==1.5.2",
    "pydantic==2.10.4",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
