[project]
name = "prime-pricing-frontend"
version = "1.0.0"
description = "Application web Streamlit – prédiction de prime d'assurance automobile"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.30",
    "pandas>=2.2",
    "numpy>=1.26",
    "sqlalchemy>=2.0",
    "toml>=0.10",
    "plotly>=5.18",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]
lint = [
    "ruff>=0.4",
]
docs = [
    "mkdocs>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
