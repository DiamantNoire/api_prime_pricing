[project]
name = "dev-build-models"
version = "1.0.0"
description = "Pipeline ML de prédiction de prime d'assurance automobile (fréquence + sévérité)"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas>=2.1",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
